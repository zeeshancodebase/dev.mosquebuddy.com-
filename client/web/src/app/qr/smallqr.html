<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MosqueBuddy — QR Sticker Sheet</title>
    <style>
        :root {
            --forest: #0C1A14;
            --emerald: #059669;
            --gold: #D4A843;
            --cream: #F0F4F2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #e7e7e7;
            margin: 0;
            padding: 24px;
        }

        .toolbar {
            max-width: 900px;
            margin: 0 auto 20px auto;
            background: var(--forest);
            color: var(--cream);
            padding: 16px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .toolbar p {
            margin: 4px 0 0 0;
            font-size: 13px;
            opacity: 0.8;
        }

        .toolbar h2 {
            margin: 0;
            font-size: 17px;
        }

        .toolbar button {
            background: var(--emerald);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .toolbar button:hover {
            background: #047857;
        }

        .sheet {
            width: 210mm;
            height: 297mm;
            margin: 0 auto;
            background: white;
            padding: 5mm;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 2mm;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }


        .card {
            border: 1px dashed #9aa39c;
            border-radius: 4mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2mm;
            text-align: center;
            position: relative;
            min-height: 0;
            background: #FFFDF6;
        }


        .qr-box {
            width: 60mm;
            height: 60mm;
            border: 1.5px dashed var(--emerald);
            border-radius: 3mm;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;

            background: repeating-linear-gradient(45deg,
                    #f7f9f8,
                    #f7f9f8 6px,
                    #eef2f0 6px,
                    #eef2f0 12px);
        }

        /* Placeholder crosshair lines */
        .qr-box::before,
        .qr-box::after {
            content: "";
            position: absolute;
            background: var(--emerald);
            opacity: 0.5;
            pointer-events: none;
        }

        .qr-box::before {
            width: 100%;
            height: 1px;
            top: 50%;
        }

        .qr-box::after {
            height: 100%;
            width: 1px;
            left: 50%;
        }

        /* -----------------------------
   REAL QR IS AVAILABLE
   ----------------------------- */

        .qr-box.has-qr {
            border: none;
            background: white;
        }

        .qr-box.has-qr::before,
        .qr-box.has-qr::after {
            display: none;
        }

        .qr-box.has-qr .qr-image {
            width: 55mm;
            height: 55mm;
            object-fit: contain;
            display: block;
        }

        .qr-image {
            width: 55mm;
            height: 55mm;
            object-fit: contain;
            display: block;
        }

        .qr-label {
            font-size: 8px;
            color: var(--emerald);
            font-weight: 700;
            letter-spacing: 0.5px;
            background: white;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 2;
        }

        .anchor-text {
            font-size: 11px;
            font-weight: 700;
            color: var(--forest);
            line-height: 1.3;
        }

        .brand-mark {
            margin-top: 1mm;
            font-size: 12px;
            color: var(--emerald);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .brand-mark span {
            color: var(--gold);
        }

        .cut-corner {
            position: absolute;
            width: 6px;
            height: 6px;
            border-color: #c7cdc9;
        }

        .cut-corner.tl {
            top: -1px;
            left: -1px;
            border-top: 1px solid;
            border-left: 1px solid;
        }

        .cut-corner.tr {
            top: -1px;
            right: -1px;
            border-top: 1px solid;
            border-right: 1px solid;
        }

        .cut-corner.bl {
            bottom: -1px;
            left: -1px;
            border-bottom: 1px solid;
            border-left: 1px solid;
        }

        .cut-corner.br {
            bottom: -1px;
            right: -1px;
            border-bottom: 1px solid;
            border-right: 1px solid;
        }

        .qr-image {
            width: 55mm;
            height: 55mm;
            object-fit: contain;
            display: block;
        }


        @media print {
            body {
                background: white;
                padding: 0;
            }

            .toolbar {
                display: none;
            }

            .sheet {
                box-shadow: none;
                margin: 0;
            }

            @page {
                size: A4;
                margin: 0;
            }
        }
    </style>
</head>

<body>

    <div class="toolbar">
        <div>
            <h2>MosqueBuddy — QR Sticker Sheet</h2>
            <p>12 stickers per A4 · each QR slot is exactly 55mm × 55mm · print on your sticker paper</p>
        </div>
        <button onclick="window.print()">🖨️ Print this sheet</button>
    </div>

    <div class="sheet">
        <!-- 12 cards, repeated via loop below in a real generator; hand-written here for clarity -->
    </div>

    <script>
        const QR_IMAGE = 'MosqueBuddy_QR.png';

        const sheet = document.querySelector('.sheet');

        for (let i = 0; i < 12; i++) {
            const card = document.createElement('div');
            card.className = 'card';

            card.innerHTML = `
      <div class="cut-corner tl"></div>
      <div class="cut-corner tr"></div>
      <div class="cut-corner bl"></div>
      <div class="cut-corner br"></div>

      <div class="qr-box">
        <span class="qr-label">PASTE QR HERE<br>55×55mm</span>
      </div>

      <div class="anchor-text">
        🕌 Find Jamā'ah Timings<br>
        Near You — Scan Here
      </div>

      <div class="brand-mark">
        Mosque<span>Buddy</span> · مسجد کا ساتھی
      </div>
    `;

            sheet.appendChild(card);

            // Check whether the QR PNG actually exists
            const img = new Image();

            img.onload = function () {
                const qrBox = card.querySelector('.qr-box');

                qrBox.innerHTML = '';
                qrBox.classList.add('has-qr');

                img.className = 'qr-image';
                img.alt = 'MosqueBuddy QR Code';

                qrBox.appendChild(img);
            };

            img.onerror = function () {
                // QR image doesn't exist → keep the existing placeholder
            };

            img.src = QR_IMAGE;
        }
    </script>


</body>

</html>
