<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MosqueBuddy — QR Sticker Sheet</title>
    <style>
        :root {
            --forest: #0C1A14;
            --emerald: #059669;
            --gold: #D4A843;
            --cream: #F0F4F2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #e7e7e7;
            padding: 24px;
        }

        .toolbar {
            max-width: 900px;
            margin: 0 auto 20px auto;
            background: var(--forest);
            color: var(--cream);
            padding: 16px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .toolbar p {
            margin-top: 4px;
            font-size: 13px;
            opacity: 0.8;
        }

        .toolbar h2 {
            font-size: 17px;
        }

        .toolbar button {
            background: var(--emerald);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .toolbar button:hover {
            background: #047857;
        }

        /* ---- SHEET: hard-capped to exactly A4, math below guarantees one page ---- */
        .sheet {
            width: 210mm;
            height: 297mm;
            margin: 0 auto;
            background: white;
            padding: 3mm;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            /* 2 cols */
            grid-auto-rows: 86mm;
            /* fixed row height, not stretched */
            row-gap: 2mm;
            column-gap: 2mm;
            overflow: hidden;
            /* safety clamp, math leaves buffer so nothing gets cut */
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
        }

        .card {
            border: 1.5px dashed #b9c1bc;
            border-radius: 4mm;
            padding: 5.5mm 3mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            height: 86mm;
            page-break-inside: avoid;
            background: #FFFDF6;
        }

        .header-row {
            display: flex;
            align-items: center;
            gap: 2mm;
            height: 8mm;
        }

        .logo-mark {
            width: 8mm;
            height: 8mm;
            border-radius: 50%;
            background: var(--forest);
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5mm;
            flex-shrink: 0;
        }

        .logo-mark img {
            margin-left: 0.5px;
            margin-top: -0.5px;
            width: 7mm;
            height: 7mm;
            border-radius: 50%;

        }

        .header-text {
            text-align: left;
            line-height: 1.1;
        }

        .brand-name {
            font-size: 4.2mm;
            font-weight: 800;
            color: var(--forest);
        }

        .brand-name span {
            color: var(--emerald);
        }

        .brand-urdu {
            font-size: 2.4mm;
            color: var(--emerald);
            font-weight: 600;
        }

        .headline {
            margin-bottom: 1.5mm;
            font-size: 3.6mm;
            font-weight: 700;
            color: var(--forest);
            line-height: 1.2;
            height: 9mm;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-wrap {
            margin-top: 1.5mm;
            position: relative;
            width: 44mm;
            height: 44mm;
        }

        .qr-box {
            width: 44mm;
            height: 44mm;
            border: 2px solid var(--gold);
            border-radius: 3mm;
            background: repeating-linear-gradient(45deg, #f7f9f8, #f7f9f8 6px, #eef2f0 6px, #eef2f0 12px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .qr-box::before,
        .qr-box::after {
            content: "";
            position: absolute;
            background: var(--emerald);
            opacity: 0.5;
        }

        .qr-box::before {
            width: 100%;
            height: 1px;
            top: 50%;
        }

        .qr-box::after {
            height: 100%;
            width: 1px;
            left: 50%;
        }

        .qr-box.has-qr {
            border-color: var(--gold);
            background: white;
        }

        .qr-box.has-qr::before,
        .qr-box.has-qr::after {
            display: none;
        }

        .cut-corner {
            position: absolute;
            width: 6px;
            height: 6px;
            border-color: #c7cdc9;
        }

        .cut-corner.tl {
            top: -1px;
            left: -1px;
            border-top: 1px solid;
            border-left: 1px solid;
        }

        .cut-corner.tr {
            top: -1px;
            right: -1px;
            border-top: 1px solid;
            border-right: 1px solid;
        }

        .cut-corner.bl {
            bottom: -1px;
            left: -1px;
            border-bottom: 1px solid;
            border-left: 1px solid;
        }

        .cut-corner.br {
            bottom: -1px;
            right: -1px;
            border-bottom: 1px solid;
            border-right: 1px solid;
        }


        .qr-image {
            width: 44mm;
            height: 44mm;
            object-fit: contain;
            display: block;
        }

        .qr-label {
            font-size: 2.3mm;
            color: var(--emerald);
            font-weight: 700;
            background: white;
            padding: 1mm 1.5mm;
            border-radius: 1mm;
            z-index: 2;
        }

        .ribbon {
            position: absolute;
            top: -2mm;
            right: -6mm;
            background: var(--gold);
            color: var(--forest);
            font-size: 2.3mm;
            font-weight: 800;
            padding: 1mm 3mm;
            border-radius: 1mm;
            transform: rotate(12deg);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            letter-spacing: 0.2px;
            z-index: 5;

            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .cta-pill {
            margin-top: 1.5mm;
            color: var(--emerald);
            font-size: 3.4mm;
            font-weight: 800;
            letter-spacing: 0.2px;
        }

        .trust-line {
            margin-top: 1mm;
            font-size: 2.4mm;
            color: var(--forest);
            font-weight: 600;
            opacity: 0.85;
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            body {
                background: white;
                padding: 0;
            }

            .toolbar {
                display: none;
            }

            .sheet {
                box-shadow: none;
                margin: 0;
            }

            @page {
                size: A4;
                margin: 0;
            }

        }
    </style>
</head>

<body>

    <div class="toolbar">
        <div>
            <h2>MosqueBuddy — Medium QR Sticker Sheet</h2>
            <p>6 large stickers per A4 · QR is 44mm × 44mm · print at 100% scale, no fit-to-page needed</p>
        </div>
        <button onclick="window.print()">🖨️ Print this sheet</button>
    </div>

    <div class="sheet"></div>

    <script>
        const QR_IMAGE = 'MosqueBuddy_QR.png';
        const sheet = document.querySelector('.sheet');

        for (let i = 0; i < 9; i++) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `

            <div class="cut-corner tl"></div>
      <div class="cut-corner tr"></div>
      <div class="cut-corner bl"></div>
      <div class="cut-corner br"></div>

        <div class="header-row">
          <div class="logo-mark"><img src="mosquebuddy_logo.png" alt="MosqueBuddy Logo"></div>
          <div class="header-text">
            <div class="brand-name">Mosque<span>Buddy</span></div>
            <div class="brand-urdu">مسجد کا ساتھی</div>
          </div>
        </div>

        <div class="headline">Find Nearby Masjids &<br>Live Jamā'ah Timings</div>

        <div class="qr-wrap">
          <div class="ribbon">FREE APP</div>
          <div class="qr-box">
            <span class="qr-label">PASTE QR<br>44×44mm</span>
          </div>
        </div>

        <div class="cta-pill">📲 SCAN TO DOWNLOAD</div>
        <div class="trust-line">✅ Community-verified · Jumu'ah slots · Qibla</div>
      `;
            sheet.appendChild(card);

            const img = new Image();
            img.onload = function () {
                const qrBox = card.querySelector('.qr-box');
                qrBox.innerHTML = '';
                qrBox.classList.add('has-qr');
                img.className = 'qr-image';
                img.alt = 'MosqueBuddy QR Code';
                qrBox.appendChild(img);
            };
            img.onerror = function () { };
            img.src = QR_IMAGE;
        }
    </script>

</body>

</html>
